<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bookmarklet Collection</title>
  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
      font-size: 18px;
      background-color: #fff;
      color: #333;
      padding: 20px;
    }
    h1 { font-size: 24px; margin-bottom: 20px; }
    p { margin-bottom: 20px; }
    #error-message { display: none; color: #c00; background: #fee; padding: 15px; border-radius: 5px; margin-bottom: 20px; }
    #bookmarklet-list { list-style: none; padding: 0; }
    #bookmarklet-list li { margin-bottom: 10px; }
    #bookmarklet-list a { color: #07c; border: 1px solid #07c; padding: 5px 8px; text-decoration: none; border-radius: 5px; }
    #bookmarklet-list a:hover { background: #07c; color: #fff; }
    #bookmarklet-list .readme { margin-left: 10px; font-size: 0.85em; color: #888; font-style: italic; }
  </style>
</head>

<body>
  <h1>Diego's Bookmarklet Collection</h1>
  <p>Drag the links below to your bookmarks bar. Click them on any page to run the code.</p>
  <div id="error-message"></div>
  <ul id="bookmarklet-list"></ul>

  <script>
    const CDN = "https://cdn.jsdelivr.net/gh/DiegoFleitas/bookmarklet-collection@main";
    const listEl = document.getElementById("bookmarklet-list");
    const errorEl = document.getElementById("error-message");

    function showError(msg) {
      errorEl.textContent = msg;
      errorEl.style.display = "block";
    }

    function isJs(code) {
      if (!code || !code.trim()) return false;
      const t = code.trim();
      if (t.startsWith("<!") || t.startsWith("<html") || code.includes("<title>404")) return false;
      return true;
    }

    async function sha384(text) {
      const data = new TextEncoder().encode(text);
      const hash = await crypto.subtle.digest("SHA-384", data);
      return "sha384-" + btoa(String.fromCharCode(...new Uint8Array(hash)));
    }

    async function loadOne(name, expectedHash) {
      const url = `${CDN}/${name}/index.js`;
      const displayName = name.replace(/-/g, " ");
      const readmeUrl = `https://github.com/DiegoFleitas/bookmarklet-collection/blob/main/${name}/README.md`;
      try {
        const res = await fetch(url);
        if (!res.ok) throw new Error(res.status + " " + res.statusText);
        const code = await res.text();
        if (!isJs(code)) throw new Error("Invalid response");
        const actualHash = await sha384(code);
        if (actualHash !== expectedHash) {
          listEl.appendChild(Object.assign(document.createElement("li"), {
            style: "color:#c00",
            textContent: `${displayName} — integrity check failed`
          }));
          return;
        }
        const li = document.createElement("li");
        const a = document.createElement("a");
        a.href = "javascript:" + encodeURIComponent(code);
        a.textContent = displayName;
        a.onclick = () => false;
        li.appendChild(a);
        const readme = document.createElement("a");
        readme.href = readmeUrl;
        readme.className = "readme";
        readme.textContent = "README";
        readme.target = "_blank";
        li.appendChild(readme);
        listEl.appendChild(li);
      } catch (err) {
        listEl.appendChild(Object.assign(document.createElement("li"), {
          style: "color:#c00",
          textContent: `⚠ ${displayName} — ${err.message}`
        }));
      }
    }

    (async function () {
      try {
        const res = await fetch("bookmarklet-integrity.json");
        if (!res.ok) throw new Error("Could not load bookmarklet list");
        const manifest = await res.json();
        const names = Object.keys(manifest).sort();
        if (!names.length) throw new Error("No bookmarklets in list");
        for (const name of names) {
          await loadOne(name, manifest[name]);
        }
      } catch (err) {
        showError(err.message);
      }
    })();
  </script>
</body>

</html>
