<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bookmarklet Collection</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=Orbitron:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./styles.css" />
  <link rel="apple-touch-icon" sizes="180x180" href="./favicon_io/apple-touch-icon.png" />
  <link rel="icon" type="image/png" sizes="32x32" href="./favicon_io/favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="./favicon_io/favicon-16x16.png" />
  <link rel="shortcut icon" href="./favicon_io/favicon.ico" />
  <link rel="manifest" href="./favicon_io/site.webmanifest" />
</head>

<body>
  <div class="retro-bg">
    <div class="grid-overlay"></div>
    <div class="page-shell">
      <header class="page-header neon-glow">
        <h1 class="page-title">Diego's <span class="neon-accent">Bookmarklet</span> Collection</h1>
        <p class="page-subtitle">Drag any bookmarklet to your bookmarks bar, then click it on any page to run the code.</p>
      </header>
      <main class="page-main animated-reveal">
        <div id="error-message" role="alert"></div>
        <ul id="bookmarklet-list" class="bookmarklet-list"></ul>
      </main>
    </div>
  </div>

  <script>
    // Animate page load with staggered reveals
    window.addEventListener('DOMContentLoaded', () => {
      document.querySelector('.animated-reveal').classList.add('show');
    });
    const CDN = "https://cdn.jsdelivr.net/gh/DiegoFleitas/bookmarklet-collection@main";
    const listEl = document.getElementById("bookmarklet-list");
    const errorEl = document.getElementById("error-message");

    function showError(msg) {
      errorEl.textContent = msg;
      errorEl.style.display = "block";
    }

    function isJs(code) {
      if (!code || !code.trim()) return false;
      const t = code.trim();
      if (t.startsWith("<!") || t.startsWith("<html") || code.includes("<title>404")) return false;
      return true;
    }

    async function sha384(text) {
      const data = new TextEncoder().encode(text);
      const hash = await crypto.subtle.digest("SHA-384", data);
      return "sha384-" + btoa(String.fromCharCode(...new Uint8Array(hash)));
    }

    async function loadOne(name, expectedHash) {
      const url = `${CDN}/${name}/index.js`;
      const displayName = name.replace(/-/g, " ");
      const readmeUrl = `https://github.com/DiegoFleitas/bookmarklet-collection/blob/main/${name}/README.md`;
      try {
        const res = await fetch(url);
        if (!res.ok) throw new Error(res.status + " " + res.statusText);
        const code = await res.text();
        if (!isJs(code)) throw new Error("Invalid response");
        const actualHash = await sha384(code);
        if (actualHash !== expectedHash) {
          listEl.appendChild(Object.assign(document.createElement("li"), {
            className: "bookmarklet-item error-item",
            textContent: `${displayName} — integrity check failed — the code may have been modified or the CDN cache is stale`
          }));
          return;
        }
        const li = document.createElement("li");
        li.className = "bookmarklet-item";
        const a = document.createElement("a");
        a.className = "bookmarklet-link";
        a.href = "javascript:" + encodeURIComponent(code);
        a.textContent = displayName;
        a.onclick = () => false;
        li.appendChild(a);
        // Add README link for all bookmarklets (README files are optional).
        const readme = document.createElement("a");
        readme.href = readmeUrl;
        readme.className = "bookmarklet-readme";
        readme.textContent = "README";
        readme.target = "_blank";
        li.appendChild(readme);
        listEl.appendChild(li);
      } catch (err) {
        listEl.appendChild(Object.assign(document.createElement("li"), {
          className: "bookmarklet-item error-item",
          textContent: `⚠ ${displayName} — ${err.message}`
        }));
      }
    }

    (async function () {
      try {
        // Manifest is expected to live alongside this HTML file.
        // If the file is opened via file:// or moved to a different directory,
        // this relative path may need to be updated.
        const res = await fetch("./bookmarklet-integrity.json");
        if (!res.ok) throw new Error(`Could not load bookmarklet list (HTTP ${res.status})`);
        const manifest = await res.json();
        const names = Object.keys(manifest).sort();
        if (!names.length) throw new Error("No bookmarklets in list");
        const loadPromises = names.map(name => loadOne(name, manifest[name]));
        await Promise.allSettled(loadPromises);
      } catch (err) {
        if (err instanceof SyntaxError) {
          showError("Could not parse bookmarklet list (invalid JSON)");
        } else {
          showError(err.message);
        }
      }
    })();
  </script>
</body>

</html>
