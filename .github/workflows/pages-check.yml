name: Pages check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  entrypoint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check docs entrypoint exists
        run: |
          test -f docs/index.html || { echo "Missing docs/index.html"; exit 1; }

      - name: Check docs/index.html contains required strings
        run: |
          grep -q 'id="bookmarklet-list"' docs/index.html || { echo "Missing #bookmarklet-list"; exit 1; }
          grep -q 'loadBookmarklet' docs/index.html || { echo "Missing loadBookmarklet"; exit 1; }
          grep -q 'git/trees/main' docs/index.html || { echo "Missing GitHub API URL"; exit 1; }

  bookmarklet-dirs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify bookmarklet structure
        run: |
          # The integrity check already validates that all bookmarklet dirs
          # (those with index.js) are in the manifest, so this just confirms
          # the basic structure is sound by listing what will be processed.
          echo "Checking bookmarklet directories..."
          found=0
          for d in */; do
            name="${d%/}"
            # Skip hidden directories
            if [[ "$name" == .* ]]; then continue; fi
            # If directory has index.js, it's a bookmarklet
            if [[ -f "${name}/index.js" ]]; then
              echo "  ✓ ${name}"
              found=$((found + 1))
            fi
          done
          echo "Found ${found} bookmarklet(s)"
          if [[ $found -eq 0 ]]; then
            echo "ERROR: No bookmarklets found!"
            exit 1
          fi

  integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify bookmarklet integrity manifest
        run: |
          test -f docs/bookmarklet-integrity.json || { echo "Missing docs/bookmarklet-integrity.json"; exit 1; }
          node scripts/verify-integrity.js

  link-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check links in README and docs
        uses: lycheeverse/lychee-action@v1
        with:
          args: 'README.md docs/index.html --no-progress --timeout 10'
          fail: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
