name: Docs / site check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Check docs
        run: |
          test -f docs/index.html || { echo "Missing docs/index.html"; exit 1; }
          grep -q 'id="bookmarklet-list"' docs/index.html || { echo "Missing #bookmarklet-list"; exit 1; }
          grep -q 'loadOne(' docs/index.html || { echo "Missing loadOne() loader"; exit 1; }
          test -f docs/bookmarklet-integrity.json || { echo "Missing bookmarklet-integrity.json"; exit 1; }
          # Ensure there is at least one bookmarklet in the manifest
          which jq >/dev/null 2>&1 || { echo "jq command not found"; exit 1; }
          count=$(jq 'length' docs/bookmarklet-integrity.json 2>/dev/null) || { echo "Failed to parse docs/bookmarklet-integrity.json (invalid JSON)"; exit 1; }
          if [ "$count" -eq 0 ]; then
            echo "No bookmarklets found in docs/bookmarklet-integrity.json"
            exit 1
          fi

      - name: Verify integrity manifest
        run: node scripts/verify-integrity.js

      - name: Check links
        uses: lycheeverse/lychee-action@v2.0.2
        with:
          args: 'README.md docs/index.html --no-progress --timeout 10 --exclude https://fonts.googleapis.com/ --exclude https://fonts.gstatic.com/'
          fail: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
